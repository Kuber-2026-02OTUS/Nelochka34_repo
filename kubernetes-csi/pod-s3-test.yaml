apiVersion: v1
kind: Pod
metadata:
  name: s3-test-pod
  namespace: default
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c"]
      args:
        - |
          echo "S3 CSI volume mounted successfully" > /mnt/s3/test.txt
          sleep 3600
      volumeMounts:
        - name: s3-volume
          mountPath: /mnt/s3
  volumes:
    - name: s3-volume
      persistentVolumeClaim:
        claimName: s3-pvc
