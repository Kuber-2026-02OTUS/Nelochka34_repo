global:
  name: consul
  datacenter: dc1

server:
  enabled: true
  replicas: 3
  bootstrapExpect: 3
  tolerations: |
    - key: "dedicated"
      operator: "Equal"
      value: "infra"
      effect: "NoSchedule"
    - key: "node-role"
      operator: "Equal"
      value: "infra"
      effect: "NoSchedule"

client:
  enabled: true

ui:
  enabled: true
  service:
    type: ClusterIP

connectInject:
  enabled: false