global:
  enabled: true

injector:
  enabled: true

server:
  enabled: true

  tolerations:
    - key: "dedicated"
      operator: "Equal"
      value: "infra"
      effect: "NoSchedule"
    - key: "node-role"
      operator: "Equal"
      value: "infra"
      effect: "NoSchedule"

  dataStorage:
    enabled: false

  auditStorage:
    enabled: false

  ha:
    enabled: true
    replicas: 3

    config: |
      ui = true

      listener "tcp" {
        tls_disable = 1
        address = "[::]:8200"
        cluster_address = "[::]:8201"
      }

      storage "consul" {
        address = "consul-server.consul.svc.cluster.local:8500"
        path = "vault/"
      }

      service_registration "kubernetes" {}

ui:
  enabled: true
  serviceType: ClusterIP